<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Creator Membership Site Estimator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Colors */
        --color-primary-bg: #F7F7F7;
        --color-secondary-bg: #FFFFFF;
        --color-border-divider: #E0E0E0;

        --color-text-primary: #2C2C2C;
        --color-text-secondary: #666666;
        --color-text-muted: #999999;

        --color-accent-primary: #FF6B6B;
        --color-accent-secondary: #007BFF; /* Optional */

        --color-success: #28A745;
        --color-warning: #FFC107;
        --color-danger: #DC3545;

        /* Typography */
        --font-family-primary: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        --font-size-base: 16px;
        --line-height-base: 1.6;

        --font-size-h1: 36px;
        --font-size-h2: 28px;
        --font-size-h3: 22px;
        --font-size-h4: 18px;
        --font-size-h5: 16px;
        --font-size-h6: 14px;
        --font-size-small: 12px;

        --font-weight-regular: 400;
        --font-weight-medium: 500;
        --font-weight-semibold: 600;
        --font-weight-bold: 700;

        /* Spacing */
        --spacing-unit: 8px;
        --spacing-xs: calc(var(--spacing-unit) * 1);   /* 8px */
        --spacing-sm: calc(var(--spacing-unit) * 2);   /* 16px */
        --spacing-md: calc(var(--spacing-unit) * 3);   /* 24px */
        --spacing-lg: calc(var(--spacing-unit) * 4);   /* 32px */
        --spacing-xl: calc(var(--spacing-unit) * 6);   /* 48px */

        /* Border Radius */
        --border-radius-sm: 4px;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --border-radius-circle: 50%;

        /* Shadows */
        --box-shadow-sm: 0px 1px 2px rgba(0, 0, 0, 0.02);
        --box-shadow-md: 0px 2px 4px rgba(0, 0, 0, 0.03);
        --box-shadow-lg: 0px 4px 8px rgba(0, 0, 0, 0.05);

        /* Transitions */
        --transition-speed-fast: 0.15s;
        --transition-speed-normal: 0.3s;
        --transition-ease: ease-in-out;
      }

      body {
        font-family: var(--font-family-primary);
        font-size: var(--font-size-base);
        line-height: var(--line-height-base);
        color: var(--color-text-primary);
        background-color: var(--color-primary-bg);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-family-primary);
        color: var(--color-text-primary);
        margin-top: 0;
        margin-bottom: var(--spacing-sm);
      }
      h1 { font-size: var(--font-size-h1); font-weight: var(--font-weight-bold); line-height: 1.2; }
      h2 { font-size: var(--font-size-h2); font-weight: var(--font-weight-semibold); line-height: 1.3; }
      h3 { font-size: var(--font-size-h3); font-weight: var(--font-weight-semibold); line-height: 1.4; }
      h4 { font-size: var(--font-size-h4); font-weight: var(--font-weight-medium); line-height: 1.5; }
      h5 { font-size: var(--font-size-h5); font-weight: var(--font-weight-medium); line-height: 1.5; }
      h6 { font-size: var(--font-size-h6); font-weight: var(--font-weight-medium); line-height: 1.5; }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
